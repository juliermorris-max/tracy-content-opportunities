name: Daily job search
on:
  schedule:
    # 08:17 CEST in summer, 08:17 CET in winter. Gate selects the right trigger.
    - cron: '17 6 * * *'
    - cron: '17 7 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '*.py'
      - 'sources.json'
      - 'templates/**'
      - 'tests/**'
      - '.github/workflows/daily-search.yml'
permissions:
  contents: read
concurrency:
  group: daily-job-search
  cancel-in-progress: false
jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.time.outputs.run }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: time
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: python schedule_gate.py
  search:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test selection, safety and failure recovery
        run: python -m unittest discover -s tests -v
      - name: Search and verify current opportunities
        run: python job_search_automation.py
      - name: Save the latest successful report and first-found history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs data
          if ! git diff --cached --quiet; then
            git commit -m "Update daily job report"
            git push
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Retain search diagnostics even after a failed run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: search-diagnostics-${{ github.run_id }}
          path: data/last_attempt.json
          if-no-files-found: ignore
          retention-days: 30
  deploy:
    needs: search
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish the successful report
        id: deployment
        uses: actions/deploy-pages@v4
